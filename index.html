<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Workout Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app"></main>

  <div id="rest-banner" class="rest-banner hidden">
    <div class="rest-info">
      <span id="rest-label">Resting...</span>
      <span id="rest-time" class="rest-time">0:00</span>
    </div>
    <div class="rest-actions">
      <button id="rest-add" class="btn small">+15s</button>
      <button id="rest-skip" class="btn small">Skip</button>
    </div>
  </div>

  <div id="video-modal" class="video-modal hidden">
    <div class="video-modal-backdrop"></div>
    <div class="video-modal-card">
      <button id="video-modal-close" class="video-modal-close" aria-label="Close video">✕</button>
      <div class="video-modal-frame" id="video-modal-frame"></div>
      <a id="video-modal-fallback" class="link-btn" target="_blank" rel="noopener">Open in YouTube instead</a>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="#/" data-route="home">Home</a>
    <a href="#/session" data-route="session">Workout</a>
    <a href="#/history" data-route="history">History</a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/exercise-registry.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/session.js"></script>
  <script src="js/import.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
